name: Keep Render Service Alive

on:
  schedule:
    - cron: "*/14 * * * *"   # every 14 minutes
  workflow_dispatch:         # manual trigger if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Web Service
        run: |
          curl -s -o /dev/null -w "%{http_code}" "https://europe-cors-proxy.onrender.com/"
